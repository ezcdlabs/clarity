name: Mobile assets

# Builds the phone apps at a release tag and attaches them to that release as
# assets. Called from ci.yml once the release job has tagged and published, so
# every release carries the apps built from exactly the commit it names — and
# runnable by hand (workflow_dispatch) to backfill a release that predates
# this workflow or re-attach assets after a transient failure.
#
# The APK is signed with the real release key (Actions secrets; the keystore's
# durable home is offline). Signature continuity is what makes the in-app
# updater possible at all: Android refuses an update whose key differs from
# the installed app's, so publishing even one release under a throwaway key
# would strand every phone that installed it.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g. v1.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # Same step as the CI android job, for the same reason: the runner ships
      # an NDK but does not point ANDROID_NDK_HOME at it in a way gomobile
      # finds.
      - name: Point at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Bind the Go core
        run: ./scripts/bind-android.sh

      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clarity-release.keystore"

      - name: Build the signed APK
        working-directory: mobile/apps/android
        env:
          TAG: ${{ inputs.tag }}
          CLARITY_KEYSTORE_FILE: ${{ runner.temp }}/clarity-release.keystore
          CLARITY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLARITY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLARITY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # versionCode = major·10⁶ + minor·10³ + patch: monotonic as long as
        # minor and patch stay under 1000, which Conventional-Commits-derived
        # versions do, and recoverable from any installed APK by inspection.
        run: |
          VER="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$VER"
          CODE=$((MA * 1000000 + MI * 1000 + PA))
          ./gradlew --no-daemon :app:assembleRelease \
            -PclarityVersionName="$VER" \
            -PclarityVersionCode="$CODE"

      # A stable asset name, because the updater downloads
      # releases/latest/download/clarity-android.apk — a name that embedded the
      # version would make every client guess it before it could fetch it. The
      # sha256 rides alongside so the updater can verify the download before
      # handing it to the system installer.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp mobile/apps/android/app/build/outputs/apk/release/app-release.apk clarity-android.apk
          sha256sum clarity-android.apk > clarity-android.apk.sha256
          gh release upload "$TAG" clarity-android.apk clarity-android.apk.sha256 --clobber

  # The IPA is unsigned on purpose: AltStore re-signs whatever it installs
  # with the user's own Apple ID, so a signature from us would be stripped
  # anyway, and shipping without one means no Apple Developer account in CI.
  ios:
    name: iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the toolchain
        run: brew install xcodegen protobuf swift-protobuf

      - name: Generate the Swift protobuf
        run: ./scripts/gen-ios-proto.sh

      - name: Bind the Go core
        run: ./scripts/bind-ios.sh

      - name: Generate the Xcode project
        working-directory: mobile/apps/ios
        run: xcodegen generate

      # MARKETING_VERSION / CURRENT_PROJECT_VERSION land in the generated
      # Info.plist as CFBundleShortVersionString / CFBundleVersion, which the
      # AltStore source's version/buildVersion must match exactly — AltStore
      # refuses an IPA that disagrees with its source entry. The code is the
      # same monotonic formula the Android versionCode uses; one formula on
      # both sides (see internal/altsource) or they drift.
      - name: Archive, unsigned
        working-directory: mobile/apps/ios
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VER="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$VER"
          CODE=$((MA * 1000000 + MI * 1000 + PA))
          xcodebuild archive \
            -project Clarity.xcodeproj \
            -scheme Clarity \
            -destination 'generic/platform=iOS' \
            -archivePath build/Clarity.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$CODE"

      # An IPA is a zip with the .app under Payload/ — that is the whole
      # packaging step when nothing is being signed.
      - name: Package and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir Payload
          cp -R mobile/apps/ios/build/Clarity.xcarchive/Products/Applications/Clarity.app Payload/
          zip -qry clarity-ios.ipa Payload
          shasum -a 256 clarity-ios.ipa > clarity-ios.ipa.sha256
          gh release upload "$TAG" clarity-ios.ipa clarity-ios.ipa.sha256 --clobber

  # The AltStore source: the JSON feed users add once, which AltStore then
  # watches for updates. Regenerated from the releases that actually carry an
  # IPA and published to GitHub Pages, so its URL never changes.
  source:
    name: AltStore source
    needs: [ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate the source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          go run ./cmd/altstore-source > site/apps.json
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8">
          <title>clarity AltStore source</title>
          <p>This is the AltStore source for
          <a href="https://github.com/ezcdlabs/clarity">clarity</a>.
          Add <code>apps.json</code> at this address as a source in AltStore;
          install instructions live in the repository's docs.</p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
