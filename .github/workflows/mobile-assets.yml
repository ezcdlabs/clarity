name: Mobile assets

# Builds the phone apps at a release tag and attaches them to that release as
# assets. Called from ci.yml once the release job has tagged and published, so
# every release carries the apps built from exactly the commit it names — and
# runnable by hand (workflow_dispatch) to backfill a release that predates
# this workflow or re-attach assets after a transient failure.
#
# The APK is signed with the real release key (Actions secrets; the keystore's
# durable home is offline). Signature continuity is what makes the in-app
# updater possible at all: Android refuses an update whose key differs from
# the installed app's, so publishing even one release under a throwaway key
# would strand every phone that installed it.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g. v1.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # Same step as the CI android job, for the same reason: the runner ships
      # an NDK but does not point ANDROID_NDK_HOME at it in a way gomobile
      # finds.
      - name: Point at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Bind the Go core
        run: ./scripts/bind-android.sh

      - name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clarity-release.keystore"

      - name: Build the signed APK
        working-directory: mobile/apps/android
        env:
          TAG: ${{ inputs.tag }}
          CLARITY_KEYSTORE_FILE: ${{ runner.temp }}/clarity-release.keystore
          CLARITY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLARITY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLARITY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # versionCode = major·10⁶ + minor·10³ + patch: monotonic as long as
        # minor and patch stay under 1000, which Conventional-Commits-derived
        # versions do, and recoverable from any installed APK by inspection.
        run: |
          VER="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$VER"
          CODE=$((MA * 1000000 + MI * 1000 + PA))
          ./gradlew --no-daemon :app:assembleRelease \
            -PclarityVersionName="$VER" \
            -PclarityVersionCode="$CODE"

      # A stable asset name, because the updater downloads
      # releases/latest/download/clarity-android.apk — a name that embedded the
      # version would make every client guess it before it could fetch it. The
      # sha256 rides alongside so the updater can verify the download before
      # handing it to the system installer.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp mobile/apps/android/app/build/outputs/apk/release/app-release.apk clarity-android.apk
          sha256sum clarity-android.apk > clarity-android.apk.sha256
          gh release upload "$TAG" clarity-android.apk clarity-android.apk.sha256 --clobber
