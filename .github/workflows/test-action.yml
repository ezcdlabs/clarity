name: Test action

# Self-test for action.yml: installs git-clarity on a Linux/macOS/Windows
# matrix using the local copy of the action and asserts the binary is on
# PATH afterwards. Runs on PRs that touch the action surface so we catch
# install-script regressions before they reach users.

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/action-install.sh'
      - '.github/workflows/test-action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/action-install.sh'
      - '.github/workflows/test-action.yml'
  workflow_dispatch: # so we can re-run on demand without touching files

jobs:
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup clarity (default version resolution)
        uses: ./
        with:
          version: v0.1.1

      - name: Verify on PATH
        shell: bash
        run: |
          which git-clarity
          git-clarity --version

  install-latest:
    name: Install (latest, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup clarity with version=latest
        uses: ./
        with:
          version: latest
      - name: Verify
        shell: bash
        run: git-clarity --version

  install-pinned:
    name: Install (pinned tag, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Drives the installer exactly as `uses: ezcdlabs/clarity@v0.1.1` does:
      # no version input, no GITHUB_ACTION_REF (the runner does not set one
      # inside a composite action), nothing but the unpack path carrying the
      # ref. This cannot be tested through `uses: ./`, which is why the bug
      # survived — a local checkout has no ref in its path.
      #
      # The pinned version is deliberately an OLD one, so "we installed the
      # latest release" cannot pass as success.
      - name: Install using only the ref in the action path
        shell: bash
        run: |
          fake="${RUNNER_TEMP}/_actions/ezcdlabs/clarity/v0.1.1"
          mkdir -p "$fake"
          INPUT_VERSION="" GITHUB_ACTION_REF="" GITHUB_ACTION_PATH="$fake" \
            bash scripts/action-install.sh

      - name: Assert the pinned version is the one that landed
        shell: bash
        run: |
          got="$(git-clarity --version)"
          echo "installed: $got"
          case "$got" in
            *0.1.1*) echo "pinned version honoured" ;;
            *) echo "::error::pin ignored — expected 0.1.1, got: $got"; exit 1 ;;
          esac
