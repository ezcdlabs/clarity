name: 'Setup clarity'
description: 'Install git-clarity and optionally report a pipeline event to refs/clarity/events. The job needs `permissions: contents: write` for the report call to succeed (clarity pushes to a git ref).'
author: 'EzcdLabs'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  version:
    description: 'Explicit clarity version to install (e.g. v0.1.1). Defaults to the action ref if it looks like a semver tag, otherwise the latest GitHub release.'
    required: false
    default: ''
  stage:
    description: 'Pipeline stage to report. Either `ci` or `deploy` — clarity is deliberately limited to those two stages. When combined with status, the action also runs `git clarity report <stage> <status>` after installing.'
    required: false
    default: ''
  status:
    description: 'Status to report (started, passed, failed, skipped). When combined with stage, the action also runs `git clarity report <stage> <status>` after installing.'
    required: false
    default: ''
  target:
    description: 'Which deployable this deploy event is about, for a repo that ships several from one trunk (e.g. `ios`). Valid only with `stage: deploy` — CI answers one question for the whole commit and never fans out. Omit it to report the untargeted deploy.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install git-clarity
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "PROBE ctx github.action_ref = '${{ github.action_ref }}'"
        echo "PROBE env GITHUB_ACTION_REF = '${GITHUB_ACTION_REF:-<unset>}'"
        echo "PROBE ctx github.action_repository = '${{ github.action_repository }}'"
        bash "${GITHUB_ACTION_PATH}/scripts/action-install.sh"

    - name: Report event
      if: ${{ inputs.stage != '' && inputs.status != '' }}
      shell: bash
      # Inputs go through env, never interpolated into the script body. `${{ }}`
      # is substituted into the text before bash parses it, so surrounding
      # quotes are not protection — a value containing $(...) would run. The
      # install step above already does it this way.
      env:
        INPUT_STAGE: ${{ inputs.stage }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_TARGET: ${{ inputs.target }}
      # The target is a trailing positional, so an unset input has to be
      # omitted rather than passed as an empty argument: `report deploy passed
      # ""` is an explicit empty target and clarity refuses it.
      run: |
        if [ -n "$INPUT_TARGET" ]; then
          git clarity report "$INPUT_STAGE" "$INPUT_STATUS" "$INPUT_TARGET"
        else
          git clarity report "$INPUT_STAGE" "$INPUT_STATUS"
        fi
