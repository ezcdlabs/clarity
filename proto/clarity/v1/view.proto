syntax = "proto3";

package clarity.v1;

option go_package = "github.com/ezcdlabs/clarity/proto/gen/go/clarityv1;clarityv1";

// Generated into the app's own namespace rather than a top-level package, so
// nothing collides with whatever else an app links.
option java_package = "dev.ezcd.clarity.proto";
option java_multiple_files = true;
option java_outer_classname = "ClarityProto";

// The presentation model the mobile apps render.
//
// The rule this boundary follows: decisions in Go, geometry native. Anything
// that decides what is true — grouping, status resolution, lead time, which
// commits count — is settled before it crosses. Anything that decides how
// wide, what colour, or which glyph is the platform's business.
//
// That is not merely tidiness. The terminal renderer quantises to character
// cells, and most of its logic exists only because of that: reserving a cell
// for a clamp arrow, a minimum one-cell bar, shedding tick labels that would
// collide. None of it has an analogue at pixel resolution, and none of it
// should cross.
//
// Durations appear twice: preformatted, so every client reads them the way
// the TUI does, and in seconds, so a client that wants to localise or
// re-render can. The preformatted form is authoritative for display.

// Status is the resolved state of a stage. Semantic, not visual — the glyph
// and the colour are the platform's choice, and the terminal's ✓/✗ were
// picked for a greyscale-safe palette that means nothing on a phone.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_NONE = 1;     // nothing reported
  STATUS_STARTED = 2;  // in flight
  STATUS_PASSED = 3;
  STATUS_FAILED = 4;
  STATUS_SKIPPED = 5;
}

// SectionKind is one of the three lifecycle sections. They are a structural
// frame rather than a list of what happens to be active: all three are always
// present and always in this order, so a repository with nothing deployed
// still reads as "nothing has been deployed" rather than as a missing section.
enum SectionKind {
  SECTION_KIND_UNSPECIFIED = 0;
  SECTION_KIND_HEAD = 1;       // landed, CI not green yet
  SECTION_KIND_CI_PASSED = 2;  // green, waiting for a deploy
  SECTION_KIND_DEPLOYED = 3;   // shipped
}

message View {
  string repo_name = 1;
  Status ci = 2;
  Status deploy = 3;

  // Flows are the deploy targets, in display order. Always at least one: a
  // repo with no targets has exactly one, which is how the single-flow case
  // stays the same shape as the many-flow one.
  repeated Flow flows = 4;

  // Truncated reports that the window ended before the repository did, so an
  // aggregate built from it is not the whole history. The limit is carried so
  // a client can say which number ended it.
  bool truncated = 5;
  int32 limit = 6;

  // When this view was built. A mobile client holds the last good view across a
  // failed refresh, so "as of when" is the difference between stale data and
  // wrong data.
  //
  // It is also always set, which is load-bearing: gomobile cannot carry a
  // zero-length byte slice — fromSlice turns one into a null array — and a
  // message with no fields set encodes to zero bytes. One field that is never
  // zero keeps every payload representable.
  int64 generated_unix_seconds = 7;
}

message Flow {
  string name = 1;
  Status deploy = 2;

  // Undeclared marks a target seen in the events but absent from
  // .ezcd.json — a typo, or something added without updating config.
  // Surfaced rather than dropped: a silently discarded deploy is worse than
  // an unexpected tab.
  bool undeclared = 3;

  repeated Section sections = 4;
}

// Section is one of the three lifecycle bands.
//
// A section holds loose commits, batches, or both: HEAD is only loose commits,
// Deployed is only batches, and CI Passed is the one that has both — commits
// queued for the next deploy, then any attempt that has not landed yet.
message Section {
  SectionKind kind = 1;

  // Label names the band: "HEAD", "CI Passed", "Deployed". Here rather than on
  // the client so three UIs cannot disagree about what to call it.
  string label = 2;

  repeated Commit commits = 3;
  repeated Batch batches = 4;

  // Only on Deployed: this week's throughput, as the terminal puts it on the
  // right of the section rule — "W2026-40  3 deploys  2h 14m avg".
  //
  // Empty when the window was truncated through this week's bucket, where the
  // count is unknown rather than zero: printing "0 deploys" above the very
  // deploys it denies is worse than printing nothing.
  string summary = 5;
}

// Batch is one deploy attempt and the commits it carried.
message Batch {
  Status status = 1;

  // Label is the subheader the TUI writes above the batch: "deploying…",
  // "deployed", "deploy failed", or "live on production · deployed". The time
  // is not part of it — deployed_ago carries that separately so a client can
  // place it apart and keep it ticking.
  string label = 2;

  int64 deployed_unix_seconds = 3;
  string deployed_ago = 4;  // "4m 43s ago"

  // Live marks the newest passing batch: what is running in production right
  // now, as opposed to settled history. Exactly one batch in a flow has it.
  bool live = 5;

  // Set on the first batch of a week that has not been named yet — the week
  // divider the terminal draws above it. The current week is never repeated
  // here: it is already on the section, in summary.
  //
  // Weeks are marked once, and batches are ordered by commit rather than by
  // deploy time, so a redeploy of an older commit can put a week out of
  // sequence. Which batch carries the label is therefore a decision, not a
  // position a client can work out.
  string week_label = 7;

  repeated Commit commits = 6;
}

message Commit {
  string sha = 1;
  string short_sha = 2;
  string subject = 3;
  string author = 4;

  // When the commit was authored. There is no preformatted age to go with it:
  // the terminal does not put one on a row — the only timer there is the lead
  // time — and a formatted string nothing renders is a string free to drift.
  int64 authored_unix_seconds = 5;

  // Only CI. There is deliberately no deploy status on a commit: whether it
  // shipped is said by the section and the batch it sits in, and a second mark
  // repeating that is the one the terminal renderer has never drawn.
  Status ci = 7;

  // Stale marks a CI result a newer commit has already superseded. The TUI
  // mutes it rather than colouring it, because a build that failed three
  // commits ago and has since gone green is history, not an alarm.
  bool ci_stale = 8;

  // Lead time is absent for a commit that has not shipped, and for one the
  // configured mode excludes. Zero seconds with an empty string means absent;
  // it is not the same as a lead time of zero.
  //
  // Named "known" rather than the obvious "has_": protoc-gen-swift generates
  // its own `has` accessors and renames any field that would collide with one,
  // so `has_lead_time` arrives in Swift under a mangled name while Go and
  // Kotlin see it as written. A field name one of the three target languages
  // cannot spell is a bad field name.
  bool lead_time_known = 9;
  int64 lead_time_seconds = 10;
  string lead_time = 11;
  // Live marks a lead time still running — the commit is deployed but the
  // clock has not stopped, so a client may want to keep it ticking.
  bool lead_time_live = 12;
  // Where a live lead time started counting, so a client can keep it accurate
  // without asking for the view again. Only set when lead_time_live is.
  int64 lead_time_anchor_unix_seconds = 13;
}

// RepoList is the menu of tracked repositories.
message RepoList {
  repeated RepoSummary repos = 1;

  // Always set, for the reason View.generated_unix_seconds explains: an empty
  // list would otherwise encode to zero bytes and cross as null.
  int64 generated_unix_seconds = 2;
}

message RepoSummary {
  // ID is derived from the URL, so the same repository is the same entry
  // across launches and devices.
  string id = 1;

  // Name is the last path segment, and the one part of a label that is never
  // abbreviated away. Namespace is everything before it, shown dimmed in
  // front; empty when the path is a single segment. Host is for the subtitle
  // and is never part of the name.
  //
  // Derived here rather than in each app so that Android and iOS call the same
  // repository by the same name. The rule is pure git with no host detection:
  // clarity does not know what GitHub is, and a rule that did would be wrong
  // on a box in a cupboard.
  string name = 2;
  string namespace = 6;
  string host = 7;

  // Alias is what the user renamed this to, on this device only. When set it
  // replaces the title and the derived namespace/name moves to the subtitle.
  string alias = 8;

  string url = 3;
  string branch = 4;

  // The last view's verdicts, so a switcher can show how each repository is
  // doing without opening it. Absent until a repository has been read once —
  // which is why these are statuses and not booleans: "not known yet" is a
  // different thing from "nothing reported".
  Status ci = 9;
  Status deploy = 10;

  // One entry per deploy target, in the order the tabs show them. A switcher
  // row draws one glyph each, with no names, and never hides one.
  repeated FlowSummary flows = 11;
}

// FlowSummary is a deploy target's last known verdict.
message FlowSummary {
  string name = 1;
  Status deploy = 2;
}

// SyncResult is what a fetch did, rather than whether it threw.
//
// A fetch has outcomes a UI must tell apart and an exception cannot: a host
// nobody has agreed to yet is a question, a rejected key is a fixable setup
// step with its own screen, and everything else is a message. Matching on the
// text of an error to find out which would be a parser for prose, in three
// clients, that breaks when git rewords something.
message SyncResult {
  Outcome outcome = 1;

  // Message is already written for a person to read — git's own diagnosis,
  // usually — and is shown as-is rather than replaced with a category.
  string message = 2;

  // Set when the outcome is about a host key, for the dialog that asks.
  HostKey host_key = 3;

  // The raw stderr behind an authentication failure, for the "Show git output"
  // disclosure. Empty when there is nothing more to show than the message.
  string git_output = 4;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_OK = 1;
  // The host is not in this device's known_hosts. Ask, then TrustHost.
  OUTCOME_HOST_KEY_UNKNOWN = 2;
  // It is, and it is presenting something else. Ask louder.
  OUTCOME_HOST_KEY_CHANGED = 3;
  // The host refused this device's key. The key needs adding on the host.
  OUTCOME_AUTH_DENIED = 4;
  OUTCOME_FAILED = 5;
}

message HostKey {
  string host = 1;
  string type = 2;         // "ED25519", as a host publishes it
  string fingerprint = 3;  // "SHA256:…", as a host publishes it
}
