services:
  server:
    # Dockerfile + keys moved into internal/gittest/sshserver/ as part of
    # gittest growing an SSH backend. This file (and the rest of
    # test/integration/) is being retired — once the new SSH tests under
    # internal/gittest and clarityrefs/ are validated to catch the same
    # regressions, this whole directory is deleted. Until then keep this
    # compose file working so both suites can be run side by side for the
    # mutation experiments.
    build:
      context: ../../internal/gittest/sshserver
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 2s
      timeout: 5s
      retries: 15

  client:
    build:
      context: ../..
      dockerfile: test/integration/client/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../..:/workspace       # live mount of the repo root
    working_dir: /workspace
    environment:
      - CLARITY_SSH_SERVER=server
    # Default command: run the integration tests.
    # Override with `docker compose run --rm client bash` for a manual shell.
    command: >
      go test -v -count=1 -tags integration
      ./test/integration/...
